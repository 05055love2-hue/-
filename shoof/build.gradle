plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shoof.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.shoof.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('shoof.keystore')
            storePassword 'car12345'
            keyAlias 'car'
            keyPassword 'car12345'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
