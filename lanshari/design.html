<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0e1a;color:#e8eaf0;overflow:hidden;height:100vh;width:100vw}
.bg-anim{position:fixed;inset:0;z-index:0;transition:background 0.8s;
  background:radial-gradient(ellipse 80% 60% at 20% 80%,rgba(79,140,255,.08) 0%,transparent 70%),
  radial-gradient(ellipse 60% 50% at 80% 20%,rgba(168,85,247,.06) 0%,transparent 70%),
  linear-gradient(135deg,#0a0e1a,#111827 50%,#0a0e1a)}
.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:16px}
.glass-sm{background:rgba(255,255,255,.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:12px}
.mu{color:#8b92a8}.ac{color:#4f8cff}
.si{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;transition:all .2s}
.si:hover{background:rgba(255,255,255,.1)}.si.active svg{filter:drop-shadow(0 0 6px currentColor)}
.da{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .25s;position:relative}
.da:hover{transform:scale(1.1)}.da:active{transform:scale(.95)}
.di{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;transition:all .25s;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.dl{font-size:11px;color:#8b92a8;font-weight:600;text-align:center;max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yt-va{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:20px;opacity:.3}
.yt-bar{width:4px;background:#4f8cff;border-radius:2px;transition:height .15s}
.yb{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;border:none;background:transparent;color:#e8eaf0}
.yb:hover{background:rgba(255,255,255,.1)}
.ybp{width:48px;height:48px;background:#ff0000!important;box-shadow:0 4px 20px rgba(255,0,0,.3)}.ybp:hover{transform:scale(1.1)}
.pb{width:100%;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;cursor:pointer}
.pf{height:100%;background:#ff0000;border-radius:2px;width:35%;transition:width .3s}
.mo{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}
.mo.show{display:flex}
.po{position:fixed;inset:0;z-index:90;display:none}.po.show{display:flex}
.ao{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;cursor:pointer;transition:all .2s}
.ao:hover{background:rgba(255,255,255,.08)}
.sr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;transition:background .2s}
.sr:hover{background:rgba(255,255,255,.04)}
.tg{width:42px;height:24px;border-radius:12px;background:rgba(255,255,255,.15);position:relative;cursor:pointer;transition:background .3s;flex-shrink:0}
.tg.on{background:#4f8cff}.tg::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;right:3px;transition:transform .3s}.tg.on::after{transform:translateX(-18px)}
.si-inp{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.15);outline:none}
.si-inp::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#4f8cff;cursor:pointer;box-shadow:0 2px 8px rgba(79,140,255,.4)}
.cd{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s}
.cd:hover,.cd.active{border-color:#fff;transform:scale(1.15)}
.wt{width:80px;height:50px;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:all .2s}
.wt:hover,.wt.active{border-color:#4f8cff;transform:scale(1.08)}
.tb{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;border:none;color:#8b92a8;background:transparent}
.tb.active{background:rgba(79,140,255,.15);color:#4f8cff}.tb:hover{background:rgba(255,255,255,.06)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.asu{animation:slideUp .35s ease-out}.af{animation:fadeIn .3s ease-out}

/* Theme: Sport gauge */
.gauge-ring{position:relative;width:200px;height:200px}
.gauge-ring svg{transform:rotate(-90deg)}
.gauge-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* Theme: Luxury gold accents */
.lux-gold{color:#d4a853}
.lux-border{border-color:rgba(212,168,83,.2)!important}
.lux-bg{background:rgba(212,168,83,.06)!important}

/* Theme card in settings */
.theme-card{border-radius:14px;overflow:hidden;cursor:pointer;border:3px solid transparent;transition:all .3s;position:relative}
.theme-card:hover{transform:scale(1.03);border-color:rgba(255,255,255,.15)}
.theme-card.active{border-color:#4f8cff;box-shadow:0 0 20px rgba(79,140,255,.25)}
.theme-card .theme-badge{position:absolute;top:8px;left:8px;padding:2px 10px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(79,140,255,.8);color:#fff;display:none}
.theme-card.active .theme-badge{display:block}
</style>

function getTimeData(){
  const n=new Date();let h=n.getHours();const m=n.getMinutes(),s=n.getSeconds(),ap=h>=12?'م':'ص';h=h%12||12;
  const days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const toAr=n=>n.toString().replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
  return {h:h.toString().padStart(2,'0'),m:m.toString().padStart(2,'0'),s:s.toString().padStart(2,'0'),ap,
    date:`${days[n.getDay()]} ${toAr(n.getDate())} ${months[n.getMonth()]} ${toAr(n.getFullYear())}`,
    hijri:n.toLocaleDateString('ar-SA-u-ca-islamic',{year:'numeric',month:'long',day:'numeric'})};
}

function renderMain(){

  ms.innerHTML=(builders[curTheme]||buildClassic)();

  const bgs={classic:'radial-gradient(ellipse 80% 60% at 20% 80%,rgba(79,140,255,.08) 0%,transparent 70%),radial-gradient(ellipse 60% 50% at 80% 20%,rgba(168,85,247,.06) 0%,transparent 70%),linear-gradient(135deg,#0a0e1a,#111827 50%,#0a0e1a)',

function animSportGauge(){
  const arc=document.getElementById('speed-arc');
  if(!arc)return;
  const pct=Math.min(speed/200,1);
  arc.setAttribute('stroke-dashoffset',597-(597*pct*.75));
}

// ============ DOCK ============
function renderDock(){
  const dk=document.getElementById('app-dock');if(!dk)return;
  dk.innerHTML='';
  for(let i=0;i<5;i++){
    const a=dockSlots[i],d=document.createElement('div');d.className='da';
    if(a){
      d.innerHTML=`<div class="di" style="background:${a.gradient};">${IC[a.icon]||''}</div><span class="dl">${a.name}</span>`;
      d.addEventListener('click',()=>openAppPage(a.id));
      const eb=document.createElement('div');
      eb.style.cssText='position:absolute;top:-4px;left:-4px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;opacity:0;transition:opacity .2s;';
      eb.textContent='✏️';eb.onclick=e=>{e.stopPropagation();openModal(i);};d.appendChild(eb);
      d.addEventListener('mouseenter',()=>eb.style.opacity='1');d.addEventListener('mouseleave',()=>eb.style.opacity='0');
    }else{
      d.innerHTML=`<div class="di" style="background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.15);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8b92a8" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><span class="dl" style="color:#8b92a8;">إضافة</span>`;
      d.onclick=()=>openModal(i);
    }
    dk.appendChild(d);
  }
}

// ============ MODAL ============
function openModal(si){
  editSlot=si;const list=document.getElementById('app-list');list.innerHTML='';
  if(dockSlots[si]){const rd=document.createElement('div');rd.className='ao';rd.style.cssText='border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px;padding-bottom:14px;';
    rd.innerHTML=`<div style="width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7f1d1d,#ef4444);flex-shrink:0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div><div><div style="font-weight:700;font-size:14px;color:#ef4444;">إزالة التطبيق</div></div>`;
    rd.onclick=()=>{dockSlots[si]=null;renderDock();closeModal();};list.appendChild(rd);}
  const used=dockSlots.filter(Boolean).map(a=>a.id);
  allApps.forEach(app=>{const u=used.includes(app.id);const d=document.createElement('div');d.className='ao';if(u)d.style.opacity='.4';
    d.innerHTML=`<div style="width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:${app.gradient};flex-shrink:0;">${IC[app.icon]||''}</div><div style="flex:1;"><div style="font-weight:700;font-size:14px;">${app.name}</div></div>${u?'<span class="mu" style="font-size:11px;">مستخدم</span>':''}`;
    if(!u)d.onclick=()=>{dockSlots[editSlot]={...app};renderDock();closeModal();};list.appendChild(d);});
  document.getElementById('app-modal').classList.add('show');
}
function closeModal(){document.getElementById('app-modal').classList.remove('show');}

// ============ CLOCK / BT / WIFI / YT / SPEED ============
function updateClock(){
  const t=getTimeData();
  const ce=document.getElementById('clock-time');if(ce)ce.textContent=`${t.h}:${t.m}`;
  const se=document.getElementById('clock-seconds');if(se)se.textContent=t.s;
  const ae=document.getElementById('clock-ampm');if(ae)ae.textContent=t.ap;
  const de=document.getElementById('date-display');if(de)de.textContent=t.date;
  const he=document.getElementById('hijri-date');if(he)he.textContent=t.hijri;
}
setInterval(updateClock,1000);

function toggleBT(){btOn=!btOn;const e=document.getElementById('bt-toggle'),l=document.getElementById('bt-label');if(!e||!l)return;
  if(btOn){e.classList.add('active');e.querySelector('svg').setAttribute('stroke',curTheme==='luxury'?'#d4a853':'#4f8cff');l.textContent='متصل';l.style.color=curTheme==='luxury'?'#d4a853':'#4f8cff';}
  else{e.classList.remove('active');e.querySelector('svg').setAttribute('stroke','#8b92a8');l.textContent='مفصول';l.style.color='#8b92a8';}}
function toggleWifi(){wifiOn=!wifiOn;const e=document.getElementById('wifi-toggle'),l=document.getElementById('wifi-label');if(!e||!l)return;
  if(wifiOn){e.classList.add('active');e.querySelector('svg').setAttribute('stroke',curTheme==='luxury'?'#d4a853':'#22c55e');l.textContent='متصل';l.style.color=curTheme==='luxury'?'#d4a853':'#22c55e';}
  else{e.classList.remove('active');e.querySelector('svg').setAttribute('stroke','#8b92a8');l.textContent='مفصول';l.style.color='#8b92a8';}}

let pInt;
function togglePlay(){isPlaying=!isPlaying;const ic=document.getElementById('play-icon');if(!ic)return;
  if(isPlaying){ic.innerHTML='<rect x="6" y="4" width="4" height="16" fill="white"/><rect x="14" y="4" width="4" height="16" fill="white"/>';startProg();animVis();}
  else{ic.innerHTML='<polygon points="6,3 20,12 6,21" fill="white"/>';clearInterval(pInt);}}
function startProg(){clearInterval(pInt);pInt=setInterval(()=>{progress+=.2;if(progress>=100){progress=0;nextTrack();}const pf=document.getElementById('progress-fill');if(pf)pf.style.width=progress+'%';const ts=pDur(tracks[currentTrack].duration),cs=Math.floor(ts*progress/100);const ce=document.getElementById('yt-current');if(ce)ce.textContent=fT(cs);},200);}
function seekTrack(e){const r=e.target.getBoundingClientRect();progress=((e.clientX-r.left)/r.width)*100;const pf=document.getElementById('progress-fill');if(pf)pf.style.width=progress+'%';}
function nextTrack(){currentTrack=(currentTrack+1)%tracks.length;lTrk();}
function prevTrack(){currentTrack=(currentTrack-1+tracks.length)%tracks.length;lTrk();}
function lTrk(){progress=0;const te=document.getElementById('yt-title');if(te)te.textContent=tracks[currentTrack].title;const de=document.getElementById('yt-duration');if(de)de.textContent=tracks[currentTrack].duration;const ce=document.getElementById('yt-current');if(ce)ce.textContent='0:00';const pf=document.getElementById('progress-fill');if(pf)pf.style.width='0%';}
function pDur(s){const[m,sec]=s.split(':').map(Number);return m*60+sec;}
function fT(s){return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;}

function initVisualizer(){const v=document.getElementById('visualizer');if(!v)return;v.innerHTML='';
  for(let i=0;i<28;i++){const b=document.createElement('div');b.className='yt-bar';b.style.height='5px';b.style.background=curTheme==='luxury'?`hsl(${40+i*2},60%,50%)`:`hsl(${220+i*4},80%,60%)`;v.appendChild(b);}}
function animVis(){if(!isPlaying)return;const v=document.getElementById('visualizer');if(!v)return;
  for(let i=0;i<v.children.length;i++)v.children[i].style.height=(Math.random()*60+5)+'px';requestAnimationFrame(()=>setTimeout(animVis,120));}

function simSpeed(){const t=Math.floor(Math.random()*120);const step=()=>{if(Math.abs(speed-t)<2){speed=t;document.querySelectorAll('#speed-val,[id=speed-val]').forEach(e=>e.textContent=speed);if(curTheme==='sport')animSportGauge();setTimeout(simSpeed,2000+Math.random()*3000);return;}speed+=speed<t?1:-1;document.querySelectorAll('#speed-val,[id=speed-val]').forEach(e=>e.textContent=speed);if(curTheme==='sport')animSportGauge();setTimeout(step,30);};step();}
let rpmVal=2450;
function simRPM(){const t=Math.floor(Math.random()*5000+800);const step=()=>{if(Math.abs(rpmVal-t)<50){rpmVal=t;const e=document.getElementById('rpm-val');if(e)e.textContent=rpmVal;const b=document.getElementById('rpm-bar');if(b)b.style.width=Math.min(rpmVal/6000*100,100)+'%';setTimeout(simRPM,1500+Math.random()*2000);return;}rpmVal+=rpmVal<t?50:-50;const e=document.getElementById('rpm-val');if(e)e.textContent=rpmVal;const b=document.getElementById('rpm-bar');if(b)b.style.width=Math.min(rpmVal/6000*100,100)+'%';setTimeout(step,40);};step();}

// ============ INIT ============
renderMain();
setTimeout(simSpeed,1000);
setTimeout(simRPM,1200);
</script>
