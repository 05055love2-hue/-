<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>تماريني</title>
<style>
:root{--bg:#0b0d10;--card:#15181d;--card2:#1d2128;--line:rgba(255,255,255,.07);--text:#f3f4f6;--soft:#9aa1ab;--acc:#ff5a1f;--acc2:#ff8a3d;--ok:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,'Segoe UI',Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:92px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.top{padding:22px 18px 6px}
.top small{color:var(--soft);font-size:14px}
.top h1{margin:2px 0 0;font-size:28px;font-weight:800}
.wrap{padding:8px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#ff5a1f,#ff2d55);border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);top:-90px;left:-60px}
.hero>*{position:relative;z-index:1}
.hero .tag{display:inline-block;background:rgba(0,0,0,.18);border-radius:20px;padding:3px 12px;font-size:13px;font-weight:700}
.hero h2{margin:10px 0 2px;font-size:26px}
.hero p{margin:0 0 14px;opacity:.9;font-size:14px}
.big{width:100%;border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:800;background:#fff;color:#ff3d1f}
.big.acc{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.big.ghost{background:var(--card2);color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.stats b{display:block;font-size:24px;font-weight:800;color:var(--acc2)}
.stats span{color:var(--soft);font-size:12px;font-weight:600}
h3.sec{margin:20px 2px 10px;font-size:18px}
.row{display:flex;align-items:center;gap:12px}
.ex{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .ic{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex:none}
.ex b{display:block;font-size:15.5px}
.ex small{color:var(--soft);font-size:13px}
.prog{cursor:pointer;transition:transform .15s}
.prog:active{transform:scale(.98)}
.prog.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.prog .lv{font-size:12px;font-weight:700;border-radius:10px;padding:2px 9px;background:var(--card2);color:var(--soft)}
.prog.on .lv{background:var(--acc);color:#fff}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.days span{background:var(--card2);border-radius:10px;padding:4px 10px;font-size:13px;color:var(--soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:700}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
details.lib{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;padding:0 14px}
details.lib summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer}
details.lib summary::-webkit-details-marker{display:none}
details.lib p{margin:0 0 12px;color:var(--soft);font-size:14px;line-height:1.8}
details.lib .tip{background:rgba(255,90,31,.1);color:#ffb08a;border-radius:12px;padding:8px 12px;font-size:13.5px;margin-bottom:12px}
/* شاشة التمرين */
.wk .exh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.wk .exh b{font-size:17px}
.wk .exh small{color:var(--soft);margin-inline-start:auto;font-size:13px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}
.set .n{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--soft)}
.set label{display:flex;align-items:center;background:var(--card2);border-radius:12px;padding:0 10px;height:44px}
.set input{width:100%;background:none;border:0;color:var(--text);font:inherit;font-size:18px;font-weight:700;text-align:center;outline:none;min-width:0}
.set label span{color:var(--soft);font-size:12px;flex:none}
.set .ok{height:44px;border:0;border-radius:12px;background:var(--card2);color:var(--soft);font-size:20px}
.set.done .ok{background:var(--ok);color:#fff}
.set.done .n{background:var(--ok);color:#fff}
.addset{margin-top:10px;background:none;border:1px dashed var(--line);color:var(--soft);border-radius:12px;padding:8px;width:100%;font-size:14px}
.prev{color:var(--soft);font-size:12.5px;margin-top:6px}
.rest{position:fixed;left:12px;right:12px;bottom:86px;background:#1f2430;border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:none;align-items:center;gap:12px;z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.rest.show{display:flex}
.rest b{font-size:26px;font-variant-numeric:tabular-nums;min-width:70px}
.rest .bar{flex:1;height:8px;background:var(--card2);border-radius:8px;overflow:hidden}
.rest .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:100%}
.rest button{border:0;background:var(--card2);color:var(--text);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700}
.clock{font-variant-numeric:tabular-nums;color:var(--acc2);font-weight:800}
/* السجل */
.h .d{color:var(--soft);font-size:13px}
.h b{font-size:16px}
.h .m{display:flex;gap:14px;margin-top:6px;color:var(--soft);font-size:13px}
.empty{text-align:center;color:var(--soft);padding:30px 10px;font-size:15px}
/* الشريط السفلي */
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(15,17,21,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:6}
nav button{background:none;border:0;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;padding:4px}
nav button i{font-style:normal;font-size:22px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--acc2)}
nav button.on i{filter:none;opacity:1}
.page{display:none;animation:in .25s ease}
.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.credit{text-align:center;color:#5d646e;font-size:12px;margin:22px 0 6px}
.credit a{color:#5d646e}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:24px;padding:22px;width:100%;max-width:380px;text-align:center}
.modal h2{margin:6px 0}
.modal .big{margin-top:10px}
</style>
</head>
<body>

<!-- الرئيسية -->
<section class="page on" id="p-home">
  <div class="top"><small id="hello">مرحبا 👋</small><h1>جاهز للتمرين؟</h1></div>
  <div class="wrap">
    <div class="card hero">
      <span class="tag" id="hProg"></span>
      <h2 id="hDay"></h2>
      <p id="hList"></p>
      <button class="big" id="startBtn">▶ ابدأ التمرين</button>
    </div>
    <div class="stats">
      <div><b id="sWeek">0</b><span>تمارين الأسبوع</span></div>
      <div><b id="sAll">0</b><span>كل التمارين</span></div>
      <div><b id="sStreak">0</b><span>أيام متتالية</span></div>
    </div>
    <h3 class="sec">تمارين اليوم</h3>
    <div class="card" id="todayList"></div>
    <div class="credit">برمجة أبو نواف</div>
  </div>
</section>

<!-- البرامج -->
<section class="page" id="p-progs">
  <div class="top"><small>اختر برنامج يناسبك</small><h1>البرامج</h1></div>
  <div class="wrap" id="progList"></div>
</section>

<!-- مكتبة التمارين -->
<section class="page" id="p-lib">
  <div class="top"><small>طريقة كل تمرين ونصيحة</small><h1>التمارين</h1></div>
  <div class="wrap">
    <div class="chips" id="muscles"></div>
    <div id="libList"></div>
  </div>
</section>

<!-- السجل -->
<section class="page" id="p-hist">
  <div class="top"><small>كل تمارينك اللي خلصتها</small><h1>السجل</h1></div>
  <div class="wrap" id="histList"></div>
</section>

<!-- التمرين الحين -->
<section class="page" id="p-work">
  <div class="top row"><div><small>⏱ <span class="clock" id="wClock">00:00</span></small><h1 id="wTitle"></h1></div></div>
  <div class="wrap wk" id="wList"></div>
  <div class="wrap"><button class="big acc" id="finishBtn">✔ خلّصت التمرين</button>
  <button class="big ghost" id="cancelBtn" style="margin-top:10px">إلغاء</button></div>
</section>

<div class="rest" id="rest"><b id="rTime">1:30</b><div class="bar"><i id="rBar"></i></div><button id="rPlus">+30ث</button><button id="rSkip">تخطّي</button></div>

<div class="modal" id="doneModal"><div class="box">
  <div style="font-size:54px">🏆</div><h2>كفو! خلّصت التمرين</h2>
  <p id="doneTxt" style="color:var(--soft)"></p>
  <button class="big acc" id="doneOk">تمام</button>
</div></div>

<nav id="nav">
  <button data-p="home" class="on"><i>🏠</i>الرئيسية</button>
  <button data-p="progs"><i>📋</i>البرامج</button>
  <button data-p="lib"><i>🏋️</i>التمارين</button>
  <button data-p="hist"><i>📈</i>السجل</button>
</nav>

<script>
/* ========== البيانات ========== */
const MUS={chest:['صدر','🏋️'],back:['ظهر','🚣'],shoulders:['أكتاف','🤸'],arms:['ذراع','💪'],legs:['أرجل','🦵'],abs:['بطن','🔥']};
const EX={
 bench:['بنش برس بالبار','chest','استلق على البنش، نزّل البار لين يلمس صدرك تحت الحلمة بشوي، وادفعه لفوق.','خل كتوفك لورا ولتحت طول الوقت، ورجولك ثابتة في الأرض.'],
 incdb:['بنش مائل بالدمبل','chest','البنش على زاوية 30 درجة، نزّل الدمبلين جنب صدرك العلوي وادفعهم لفوق.','لا تخلي الدمبلات تصطدم فوق، وقف قبل بشوي.'],
 fly:['تفتيح بالكيبل','chest','قف في نص الكروس أوفر، وافتح يدينك وسكّرها قدامك بقوس خفيف.','الكوع منحني شوي وثابت، والحركة من الكتف.'],
 dips:['متوازي','chest','انزل لين يصير كوعك 90 درجة، وميّل جسمك شوي لقدام عشان يشتغل الصدر.','لا تنزل زيادة لو تحس بضغط على الكتف.'],
 pushup:['ضغط','chest','جسمك خط مستقيم، انزل لين صدرك يقرب من الأرض واطلع.','شد بطنك ولا تنزّل وسطك.'],
 pulldown:['سحب أمامي','back','اسحب البار لين أعلى صدرك، وارجعه لفوق بهدوء.','لا تميل لورا كثير، والسحب من الكوع مو من اليد.'],
 pullup:['عقلة','back','امسك البار أعرض من كتوفك واسحب نفسك لين ذقنك فوقه.','لو صعبة استخدم جهاز المساعدة أو مطاط.'],
 bbrow:['تجديف بالبار','back','ميّل جسمك لقدام وظهرك مستقيم، واسحب البار لبطنك.','ظهرك لا يتقوّس أبداً.'],
 cablerow:['تجديف بالكيبل جالس','back','اجلس وظهرك مستقيم، واسحب المقبض لبطنك وضم لوحات كتفك.','لا تتأرجح بجسمك لقدام ولورا.'],
 dead:['ديدلفت','back','البار قريب من رجولك، ارفعه بدفع الأرض برجولك وظهرك مستقيم.','ابدأ بوزن خفيف لين تتقن الحركة، وهو من أهم التمارين.'],
 dbpress:['ضغط أكتاف بالدمبل','shoulders','اجلس وظهرك مسنود، وادفع الدمبلين من مستوى الأذن لفوق.','لا تقوّس أسفل ظهرك.'],
 lateral:['رفرفة جانبية','shoulders','ارفع الدمبلين على الجنب لين مستوى الكتف.','وزن خفيف وحركة نظيفة أفضل من وزن ثقيل.'],
 reardelt:['رفرفة خلفية','shoulders','ميّل لقدام وافتح يدينك على الجنب.','ركّز على خلف الكتف مو على الظهر.'],
 facepull:['فيس بول','shoulders','اسحب الحبل لوجهك وافتح يدينك على الجنب.','ممتاز لصحة الكتف، سوّه دايم.'],
 curl:['بايسبس بالبار','arms','كوعك ثابت جنبك، ارفع البار لصدرك ونزّله ببطء.','لا تتمرجح بظهرك.'],
 hammer:['هامر بالدمبل','arms','مثل البايسبس بس كفوفك مقابلة بعض.','يقوّي الساعد بعد.'],
 pushdown:['ترايسبس بالكيبل','arms','كوعك ثابت جنبك، ادفع الحبل لتحت لين يدك تستقيم.','لا تحرّك كتفك.'],
 overhead:['ترايسبس فوق الرأس','arms','امسك دمبل بيدينك فوق راسك، ونزّله ورا راسك وارفعه.','كوعك يأشّر لفوق طول الوقت.'],
 squat:['سكوات بالبار','legs','البار على أعلى ظهرك، انزل كأنك بتجلس لين فخذك موازي للأرض.','ركبك بنفس اتجاه أصابع رجولك، وصدرك لفوق.'],
 legpress:['ليق برس','legs','ادفع المنصة برجولك وانزل لين ركبتك 90 درجة.','لا تقفل ركبتك فوق.'],
 rdl:['رفعة رومانية','legs','ركبك منحنية شوي، نزّل البار على رجولك لين تحس بشد ورا الفخذ.','الحركة من الورك مو من الظهر.'],
 lunge:['اندفاع','legs','خطوة كبيرة لقدام وانزل لين الركبة الخلفية تقرب من الأرض.','جسمك مستقيم وركبتك الأمامية ما تتعدى أصابعك كثير.'],
 legext:['ليق اكستنشن','legs','اجلس على الجهاز ومد رجولك لقدام.','نزّل ببطء.'],
 legcurl:['ليق كيرل','legs','اثنِ رجولك لورا على الجهاز.','لا ترفع وسطك من الجهاز.'],
 calf:['سمانة واقف','legs','اطلع على أطراف أصابعك ونزل ببطء.','وقّف ثانية فوق.'],
 plank:['بلانك','abs','اسند على كوعك وأصابع رجولك وجسمك خط مستقيم.','العدّات هنا ثواني.'],
 crunch:['كرنش','abs','استلق وارفع كتوفك عن الأرض بشد البطن.','لا تسحب راسك بيدينك.'],
 legraise:['رفع أرجل معلّق','abs','تعلّق في البار وارفع رجولك لقدام.','بدون تأرجح.']
};
const PROGS={
 full:{n:'جسم كامل',lv:'مبتدئ',w:'3 أيام بالأسبوع',d:[
  ['اليوم أ',[['squat',3,10],['bench',3,10],['bbrow',3,10],['dbpress',3,12],['plank',3,40]]],
  ['اليوم ب',[['dead',3,8],['incdb',3,10],['pulldown',3,12],['lunge',3,10],['crunch',3,15]]]]},
 ul:{n:'علوي وسفلي',lv:'متوسط',w:'4 أيام بالأسبوع',d:[
  ['علوي 1',[['bench',4,8],['bbrow',4,8],['dbpress',3,10],['pulldown',3,10],['curl',3,12],['pushdown',3,12]]],
  ['سفلي 1',[['squat',4,8],['rdl',3,10],['legpress',3,12],['legcurl',3,12],['calf',4,15]]],
  ['علوي 2',[['incdb',4,10],['cablerow',4,10],['lateral',4,15],['pullup',3,8],['hammer',3,12],['overhead',3,12]]],
  ['سفلي 2',[['dead',3,6],['lunge',3,10],['legext',3,15],['legcurl',3,12],['legraise',3,12]]]]},
 ppl:{n:'دفع - سحب - أرجل',lv:'متقدم',w:'3 أو 6 أيام بالأسبوع',d:[
  ['دفع',[['bench',4,8],['incdb',3,10],['dbpress',3,10],['lateral',4,15],['dips',3,10],['pushdown',3,12]]],
  ['سحب',[['dead',3,6],['pullup',4,8],['bbrow',3,10],['facepull',3,15],['reardelt',3,15],['curl',3,12]]],
  ['أرجل',[['squat',4,8],['rdl',3,10],['legpress',3,12],['legcurl',3,12],['calf',4,15],['legraise',3,12]]]]}
};
/* ========== التخزين ========== */
const L={get(k,d){try{const v=localStorage.getItem('tm_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('tm_'+k,JSON.stringify(v))}catch(e){}}};
let st={prog:L.get('prog','full'),idx:L.get('idx',0),hist:L.get('hist',[]),act:L.get('act',null)};
const save=()=>{L.set('prog',st.prog);L.set('idx',st.idx);L.set('hist',st.hist);L.set('act',st.act)};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isTime=id=>id==='plank';
const lastOf=id=>{for(let i=st.hist.length-1;i>=0;i--){const e=st.hist[i].ex.find(x=>x.id===id);if(e){const d=e.sets.filter(s=>s.done);if(d.length)return d[d.length-1]}}return null};

/* ========== التنقل ========== */
let cur='home';
function go(p){cur=p;document.querySelectorAll('.page').forEach(s=>s.classList.toggle('on',s.id==='p-'+p));
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
 $('nav').style.display=p==='work'?'none':'grid';scrollTo(0,0);render()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
window.goBack=()=>{if(cur==='work'||cur==='home')return false;go('home');return true};

/* ========== الرئيسية ========== */
function day(){const P=PROGS[st.prog];return P.d[st.idx%P.d.length]}
function renderHome(){
 const h=new Date().getHours();$('hello').textContent=h<12?'صباح الخير ☀️':h<18?'مساء الخير 👋':'مساء النور 🌙';
 const P=PROGS[st.prog],D=day();
 $('hProg').textContent=P.n+' • '+P.w;$('hDay').textContent=D[0];
 $('hList').textContent=D[1].length+' تمارين • تقريباً '+(D[1].length*9)+' دقيقة';
 $('startBtn').textContent=st.act?'▶ كمّل التمرين':'▶ ابدأ التمرين';
 $('todayList').innerHTML=D[1].map(([id,s,r])=>{const e=EX[id],l=lastOf(id);
  return '<div class="ex"><div class="ic">'+MUS[e[1]][1]+'</div><div><b>'+e[0]+'</b><small>'+s+' جولات × '+r+(isTime(id)?' ثانية':' عدّة')+(l&&l.w?' • آخر وزن '+l.w+' كغ':'')+'</small></div></div>'}).join('');
 const now=Date.now(),wk=st.hist.filter(x=>now-x.t<7*864e5).length;
 $('sWeek').textContent=wk;$('sAll').textContent=st.hist.length;
 const days=new Set(st.hist.map(x=>new Date(x.t).toDateString()));let s=0,d=new Date();
 if(!days.has(d.toDateString()))d.setDate(d.getDate()-1);
 while(days.has(d.toDateString())){s++;d.setDate(d.getDate()-1)}
 $('sStreak').textContent=s;
}
$('startBtn').onclick=()=>{if(!st.act){const D=day();
 st.act={t:Date.now(),name:D[0],ex:D[1].map(([id,s,r])=>{const l=lastOf(id);return{id,sets:Array.from({length:s},()=>({w:l?l.w:'',r:r,done:false}))}})};save()}
 go('work')};

/* ========== البرامج ========== */
function renderProgs(){$('progList').innerHTML=Object.entries(PROGS).map(([k,P])=>
 '<div class="card prog'+(k===st.prog?' on':'')+'" data-k="'+k+'"><div class="row"><b style="font-size:19px">'+P.n+'</b><span class="lv" style="margin-inline-start:auto">'+P.lv+'</span></div>'+
 '<small style="color:var(--soft)">'+P.w+' • '+P.d.length+' أيام تتكرر</small><div class="days">'+P.d.map(d=>'<span>'+d[0]+'</span>').join('')+'</div>'+
 (k===st.prog?'<div style="margin-top:12px;color:var(--acc2);font-weight:800;font-size:14px">✓ برنامجك الحالي</div>':'')+'</div>').join('')+
 '<p style="color:var(--soft);font-size:13px;text-align:center;line-height:1.8">نصيحة: ريّح يوم بين أيام التمرين، واشرب ماي كثير 💧</p>';
 document.querySelectorAll('.prog').forEach(c=>c.onclick=()=>{if(st.act&&!confirm('عندك تمرين شغّال، تبي تغيّر البرنامج؟'))return;st.prog=c.dataset.k;st.idx=0;st.act=null;save();renderProgs();if(navigator.vibrate)navigator.vibrate(20)})}

/* ========== المكتبة ========== */
let mus='chest';
function renderLib(){$('muscles').innerHTML=Object.entries(MUS).map(([k,m])=>'<button data-m="'+k+'" class="'+(k===mus?'on':'')+'">'+m[1]+' '+m[0]+'</button>').join('');
 document.querySelectorAll('#muscles button').forEach(b=>b.onclick=()=>{mus=b.dataset.m;renderLib()});
 $('libList').innerHTML=Object.entries(EX).filter(([,e])=>e[1]===mus).map(([id,e])=>{const l=lastOf(id);
  return '<details class="lib"><summary><div class="ex" style="border:0;padding:0;flex:1"><div class="ic">'+MUS[e[1]][1]+'</div><div><b>'+e[0]+'</b><small>'+(l&&l.w?'أفضل وزن آخر مرة: '+l.w+' كغ':'اضغط وشوف الطريقة')+'</small></div></div><span style="color:var(--soft)">⌄</span></summary><p>'+e[2]+'</p><div class="tip">💡 '+e[3]+'</div></details>'}).join('')}

/* ========== السجل ========== */
function renderHist(){if(!st.hist.length){$('histList').innerHTML='<div class="empty">ما خلّصت أي تمرين للحين 💪<br>ابدأ أول تمرين من الرئيسية</div>';return}
 $('histList').innerHTML=st.hist.slice().reverse().map(x=>{const sets=x.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0),
  vol=x.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0);
  return '<div class="card h"><div class="d">'+new Date(x.t).toLocaleDateString('ar-SA-u-ca-gregory',{weekday:'long',day:'numeric',month:'long'})+'</div><b>'+esc(x.name)+'</b>'+
  '<div class="m"><span>⏱ '+Math.max(1,Math.round(x.dur/60))+' دقيقة</span><span>✅ '+sets+' جولة</span><span>🏋️ '+vol.toLocaleString('en-US')+' كغ</span></div></div>'}).join('')}

/* ========== التمرين الحين ========== */
let clockT=null;
function renderWork(){const a=st.act;if(!a){go('home');return}
 $('wTitle').textContent=a.name;
 $('wList').innerHTML=a.ex.map((e,i)=>{const E=EX[e.id],l=lastOf(e.id),t=isTime(e.id);
  return '<div class="card"><div class="exh"><div class="ex" style="padding:0;border:0"><div class="ic">'+MUS[E[1]][1]+'</div></div><b>'+E[0]+'</b><small>'+e.sets.filter(s=>s.done).length+'/'+e.sets.length+'</small></div>'+
  e.sets.map((s,j)=>'<div class="set'+(s.done?' done':'')+'"><div class="n">'+(j+1)+'</div>'+
   '<label><input type="number" inputmode="decimal" data-i="'+i+'" data-j="'+j+'" data-f="w" value="'+esc(s.w)+'" placeholder="0"><span>كغ</span></label>'+
   '<label><input type="number" inputmode="numeric" data-i="'+i+'" data-j="'+j+'" data-f="r" value="'+esc(s.r)+'"><span>'+(t?'ث':'عدّة')+'</span></label>'+
   '<button class="ok" data-i="'+i+'" data-j="'+j+'">✓</button></div>').join('')+
  (l?'<div class="prev">آخر مرة: '+(l.w||0)+' كغ × '+l.r+'</div>':'')+
  '<button class="addset" data-i="'+i+'">+ جولة زيادة</button></div>'}).join('');
 document.querySelectorAll('#wList input').forEach(inp=>inp.oninput=()=>{a.ex[inp.dataset.i].sets[inp.dataset.j][inp.dataset.f]=inp.value;save()});
 document.querySelectorAll('#wList .ok').forEach(b=>b.onclick=()=>{const s=a.ex[b.dataset.i].sets[b.dataset.j];s.done=!s.done;save();
  if(s.done){startRest(isTime(a.ex[b.dataset.i].id)?60:90);buzz(30)}renderWork()});
 document.querySelectorAll('#wList .addset').forEach(b=>b.onclick=()=>{const e=a.ex[b.dataset.i],p=e.sets[e.sets.length-1];e.sets.push({w:p?p.w:'',r:p?p.r:10,done:false});save();renderWork()});
 clearInterval(clockT);const tick=()=>{const s=Math.floor((Date.now()-a.t)/1000);$('wClock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};tick();clockT=setInterval(tick,1000);
 try{Native.keepOn(true)}catch(e){}
}
$('finishBtn').onclick=()=>{const a=st.act,sets=a.ex.reduce((x,e)=>x+e.sets.filter(s=>s.done).length,0);
 if(!sets){alert('علّم ✓ على جولة وحدة على الأقل');return}
 a.dur=Math.round((Date.now()-a.t)/1000);a.ex.forEach(e=>e.sets=e.sets.filter(s=>s.done));a.ex=a.ex.filter(e=>e.sets.length);
 st.hist.push(a);st.act=null;st.idx++;save();stopRest();clearInterval(clockT);try{Native.keepOn(false)}catch(e){}
 const vol=a.ex.reduce((x,e)=>x+e.sets.reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0);
 $('doneTxt').innerHTML=sets+' جولة في '+Math.max(1,Math.round(a.dur/60))+' دقيقة<br>رفعت مجموع '+vol.toLocaleString('en-US')+' كغ 💪';
 $('doneModal').classList.add('show');buzz(200)};
$('doneOk').onclick=()=>{$('doneModal').classList.remove('show');go('home')};
$('cancelBtn').onclick=()=>{if(!confirm('تبي تلغي التمرين؟ اللي سجلته بيروح'))return;st.act=null;save();stopRest();clearInterval(clockT);try{Native.keepOn(false)}catch(e){}go('home')};

/* ========== مؤقت الراحة ========== */
let rEnd=0,rTot=0,rT=null;
function buzz(ms){try{Native.buzz(ms)}catch(e){if(navigator.vibrate)navigator.vibrate(ms)}}
function startRest(sec){rTot=sec;rEnd=Date.now()+sec*1000;$('rest').classList.add('show');clearInterval(rT);rT=setInterval(rTick,250);rTick()}
function rTick(){const left=Math.max(0,Math.ceil((rEnd-Date.now())/1000));$('rTime').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
 $('rBar').style.width=(left/rTot*100)+'%';if(left<=0){stopRest();buzz(600)}}
function stopRest(){clearInterval(rT);$('rest').classList.remove('show')}
$('rPlus').onclick=()=>{rEnd+=30000;rTot+=30;rTick()};$('rSkip').onclick=stopRest;

/* ========== رسم ========== */
function render(){({home:renderHome,progs:renderProgs,lib:renderLib,hist:renderHist,work:renderWork})[cur]()}
render();
</script>
</body>
</html>
