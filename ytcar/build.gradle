plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mushaghli.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mushaghli.app"
        minSdk 21
        targetSdk 34
        versionCode 12
        versionName "1.6"
    }

    signingConfigs {
        debug {
            storeFile file('ytcar.keystore')
            storePassword 'car12345'
            keyAlias 'car'
            keyPassword 'car12345'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
