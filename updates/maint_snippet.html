<!--MT-START صيانتي — برمجة أبو نواف -->
<style>
#mtP{position:fixed;inset:0;z-index:9000;background:#0e1117;color:#eef1f6;display:none;flex-direction:column;direction:rtl;font-family:inherit}
#mtP.show{display:flex}
#mtP *{box-sizing:border-box}
#mtP .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #222838}
#mtP .mh h2{margin:0;font-size:22px}
#mtP .mh button{min-width:48px;height:48px;border-radius:24px;border:none;background:#1c2230;color:#fff;font-size:20px}
#mtP .mb{flex:1;overflow:auto;padding:16px 18px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-content:start}
#mtP .odo{grid-column:1/-1;background:#161b26;border:1px solid #262d3d;border-radius:20px;padding:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
#mtP .odo b{font-size:30px;direction:ltr;font-variant-numeric:tabular-nums}
#mtP .odo small{display:block;color:#9aa3b5;font-size:13px}
#mtP .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#mtP input{background:#0e1117;border:1px solid #2f3749;color:#fff;border-radius:12px;height:46px;padding:0 12px;font:inherit;font-size:16px;width:150px}
#mtP input[type=text]{width:100%}
#mtP .btn{height:46px;border:none;border-radius:14px;padding:0 16px;font:inherit;font-size:15px;background:#2a3245;color:#fff}
#mtP .btn.p{background:#3b82f6}
#mtP .btn.g{background:#15803d}
#mtP .btn.r{background:#7f1d1d}
#mtP .it{background:#161b26;border:1px solid #262d3d;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
#mtP .it.red{border-color:#b91c1c}
#mtP .it.orange{border-color:#c2410c}
#mtP .t{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
#mtP .t i{font-style:normal;font-size:24px}
#mtP .s{font-size:14px;color:#c9cfdb}
#mtP .red .s{color:#fca5a5}
#mtP .orange .s{color:#fdba74}
#mtP .green .s{color:#86efac}
#mtP .bar{height:6px;border-radius:3px;background:#262d3d;overflow:hidden;direction:ltr}
#mtP .bar div{height:6px;border-radius:3px}
#mtP .f{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:#9aa3b5}
#mtP .f label{display:flex;flex-direction:column;gap:4px}
#mtP .f input{width:100%}
#mtP .f .w{grid-column:1/-1}
#mtP .add{grid-column:1/-1}
.mt-due{position:relative}
.mt-due:after{content:'';position:absolute;top:4px;left:4px;width:9px;height:9px;border-radius:50%;background:#f97316;box-shadow:0 0 0 2px #000}
#mtToast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2433;color:#fff;padding:12px 20px;border-radius:20px;font-size:15px;z-index:9001;display:none}
</style>
<div id="mtP" role="dialog" aria-label="صيانتي">
  <div class="mh"><h2>🔧 صيانتي</h2><button aria-label="رجوع" onclick="mtClose()">✕</button></div>
  <div class="mb" id="mtB"></div>
</div>
<div id="mtToast"></div>
<script>
(function(){
  const K='maint_v1';
  const DEF={odo:0,odoAt:'',items:[
    {id:'oil',n:'غيار الزيت',ic:'🛢️',km:5000,mo:6,d:'',k:0},
    {id:'filter',n:'الفلاتر (هواء ومكيف)',ic:'🌬️',km:10000,mo:12,d:'',k:0},
    {id:'tires',n:'تدوير الكفرات وترصيصها',ic:'🛞',km:10000,mo:0,d:'',k:0},
    {id:'brakes',n:'فحص الفرامل',ic:'🛑',km:20000,mo:12,d:'',k:0},
    {id:'battery',n:'البطارية',ic:'🔋',km:0,mo:24,d:'',k:0},
    {id:'istimara',n:'الاستمارة',ic:'📄',exp:''},
    {id:'insurance',n:'التأمين',ic:'🛡️',exp:''},
    {id:'fahs',n:'الفحص الدوري',ic:'🔍',exp:''}
  ]};
  let M; try{M=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
  if(!M||!M.items)M=JSON.parse(JSON.stringify(DEF));
  let open='';
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(M))}catch(e){}};
  const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const parse=s=>{if(!s)return null;const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
  const days=(a,b)=>Math.round((a-b)/86400000);
  const addMo=(d,m)=>{const x=new Date(d);x.setMonth(x.getMonth()+m);return x};
  const nf=n=>Number(n).toLocaleString('en');
  const dtxt=n=>{n=Math.abs(n);if(n===0)return 'اليوم';if(n===1)return 'يوم';if(n===2)return 'يومين';if(n<=10)return n+' أيام';if(n<60)return n+' يوم';const m=Math.round(n/30);return m===2?'شهرين':m<=10?m+' شهور':m+' شهر'};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function status(it){
    const t=today();
    if('exp' in it){
      const e=parse(it.exp); if(!e)return {lvl:'none',txt:'اضغط «تعديل» وحط تاريخ الانتهاء',pct:0};
      const n=days(e,t);
      if(n<0)return {lvl:'red',txt:'انتهت من '+dtxt(n)+' — جدّدها',pct:100};
      return {lvl:n<=30?'orange':'green',txt:n===0?'تنتهي اليوم':'تنتهي بعد '+dtxt(n),pct:Math.max(0,Math.min(100,100-n/365*100))};
    }
    const d=parse(it.d); if(!d)return {lvl:'none',txt:'اضغط «تعديل» وحط آخر مرة سويتها',pct:0};
    let kmL=null,dL=null,p1=0,p2=0;
    if(it.km>0&&it.k>0&&M.odo>0){kmL=it.k+it.km-M.odo;p1=(M.odo-it.k)/it.km*100}
    if(it.mo>0){const due=addMo(d,it.mo);dL=days(due,t);p2=days(t,d)/days(due,d)*100}
    if(kmL===null&&dL===null)return {lvl:'none',txt:'حدّث عداد السيارة عشان أحسب لك',pct:0};
    const late=(kmL!==null&&kmL<0)||(dL!==null&&dL<0);
    const soon=(kmL!==null&&kmL<=500)||(dL!==null&&dL<=14);
    const parts=[];
    if(kmL!==null)parts.push(kmL<0?'متأخر '+nf(-kmL)+' كم':'باقي '+nf(kmL)+' كم');
    if(dL!==null)parts.push(dL<0?'متأخر '+dtxt(dL):'باقي '+dtxt(dL));
    return {lvl:late?'red':soon?'orange':'green',txt:parts.join(' أو '),pct:Math.max(0,Math.min(100,Math.max(p1,p2)))};
  }
  const COL={red:'#ef4444',orange:'#f97316',green:'#22c55e',none:'#475069'};

  function render(){
    const B=document.getElementById('mtB'); if(!B)return;
    let h=`<div class="odo"><div><small>عداد السيارة الحين</small><b>${M.odo?nf(M.odo)+' كم':'—'}</b><small>${M.odoAt?'آخر تحديث '+M.odoAt:'حطه عشان أحسب لك الكيلومترات'}</small></div>
      <div class="row"><input id="mtOdo" type="number" inputmode="numeric" placeholder="مثلاً 85000"><button class="btn p" onclick="mtOdo()">حدّث العداد</button></div></div>`;
    M.items.forEach((it,i)=>{
      const s=status(it), isExp='exp' in it;
      h+=`<div class="it ${s.lvl}"><div class="t"><i>${it.ic||'🔧'}</i>${esc(it.n)}</div><div class="s">${s.txt}</div>
        <div class="bar"><div style="width:${s.pct}%;background:${COL[s.lvl]}"></div></div>
        <div class="row"><button class="btn g" onclick="mtDone(${i})">${isExp?'جدّدتها':'سويتها اليوم'}</button><button class="btn" onclick="mtEdit(${i})">${open===it.id?'إغلاق':'تعديل'}</button></div>`;
      if(open===it.id){
        h+=`<div class="f"><label class="w">الاسم<input type="text" id="mtN" value="${esc(it.n)}"></label>`;
        if(isExp) h+=`<label class="w">تاريخ الانتهاء<input type="date" id="mtE" value="${it.exp||''}"></label>`;
        else h+=`<label>آخر مرة<input type="date" id="mtD" value="${it.d||''}"></label><label>العداد وقتها (كم)<input type="number" inputmode="numeric" id="mtK" value="${it.k||''}"></label>
          <label>تتكرر كل (كم)<input type="number" inputmode="numeric" id="mtKm" value="${it.km||''}" placeholder="0 = بدون"></label><label>أو كل (شهر)<input type="number" inputmode="numeric" id="mtMo" value="${it.mo||''}" placeholder="0 = بدون"></label>`;
        h+=`<div class="row w"><button class="btn p" onclick="mtSave(${i})">حفظ</button>${it.id.charAt(0)==='c'?`<button class="btn r" onclick="mtDel(${i})">حذف</button>`:''}</div></div>`;
      }
      h+='</div>';
    });
    h+=`<button class="btn add" onclick="mtAdd()">＋ أضف شي ثاني تبي تتذكره</button>`;
    B.innerHTML=h;
  }
  function badge(){
    let red=0,org=0,first='';
    M.items.forEach(it=>{const s=status(it);if(s.lvl==='red'){red++;if(!first)first=it.n}else if(s.lvl==='orange'){org++;if(!first)first=it.n}});
    document.querySelectorAll('.mt-btn').forEach(b=>b.classList.toggle('mt-due',red+org>0));
    return {red,org,first};
  }
  function say(t){const e=document.getElementById('mtToast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',4000)}
  window.mtOpen=()=>{render();document.getElementById('mtP').classList.add('show')};
  window.mtClose=()=>{open='';document.getElementById('mtP').classList.remove('show');badge()};
  window.mtOdo=()=>{const v=parseInt(document.getElementById('mtOdo').value,10);if(!(v>0))return say('اكتب رقم العداد');M.odo=v;M.odoAt=iso(today());save();render();badge();say('تم تحديث العداد ✅')};
  window.mtDone=i=>{const it=M.items[i];
    if('exp' in it){const e=parse(it.exp)||today();const n=new Date(Math.max(e,today()));n.setFullYear(n.getFullYear()+1);it.exp=iso(n);say('تم — الموعد الجاي '+it.exp)}
    else{it.d=iso(today());if(M.odo>0)it.k=M.odo;say(M.odo>0?'تم ✅ سجلتها اليوم على عداد '+nf(M.odo):'تم ✅ — حدّث العداد عشان أحسب الكيلومترات')}
    save();render();badge()};
  window.mtEdit=i=>{open=open===M.items[i].id?'':M.items[i].id;render()};
  window.mtSave=i=>{const it=M.items[i],v=id=>{const e=document.getElementById(id);return e?e.value:''};
    const n=v('mtN').trim();if(n)it.n=n;
    if('exp' in it)it.exp=v('mtE');
    else{it.d=v('mtD');it.k=parseInt(v('mtK'),10)||0;it.km=parseInt(v('mtKm'),10)||0;it.mo=parseInt(v('mtMo'),10)||0}
    open='';save();render();badge();say('تم الحفظ ✅')};
  window.mtDel=i=>{M.items.splice(i,1);open='';save();render();badge()};
  window.mtAdd=()=>{const it={id:'c'+Date.now(),n:'شي جديد',ic:'🔧',km:0,mo:6,d:'',k:0};M.items.push(it);open=it.id;save();render();
    setTimeout(()=>{const e=document.getElementById('mtN');if(e){e.focus();e.select()}},50)};
  function check(){
    const b=badge(); if(!b.first)return;
    const k=iso(today()); let last='';try{last=localStorage.getItem(K+'_t')||''}catch(e){}
    if(last===k)return; try{localStorage.setItem(K+'_t',k)}catch(e){}
    say(b.red?'🔧 «'+b.first+'» موعدها فات، شيّك على صيانتي':'🔧 «'+b.first+'» موعدها قرّب');
  }
  setTimeout(check,4000); setInterval(check,60*60*1000);
})();
</script>
<!--MT-END-->
