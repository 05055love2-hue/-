plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sayarati.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sayarati.app"
        minSdk 21
        targetSdk 34
        versionCode 19
        versionName "3.17"
    }

    signingConfigs {
        debug {
            storeFile file('sayarati.keystore')
            storePassword 'car12345'
            keyAlias 'car'
            keyPassword 'car12345'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
