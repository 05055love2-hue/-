plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvhome.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tvhome.app"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    signingConfigs {
        debug {
            storeFile file('tv.keystore')
            storePassword 'car12345'
            keyAlias 'car'
            keyPassword 'car12345'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
