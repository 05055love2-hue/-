plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monadhif.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.monadhif.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        debug {
            storeFile file('cleaner.keystore')
            storePassword 'car12345'
            keyAlias 'car'
            keyPassword 'car12345'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
