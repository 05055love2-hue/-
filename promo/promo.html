<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden}
body{font-family:'Tajawal','Noto Sans Arabic',system-ui,sans-serif;color:#fff;background:#05070f;position:relative}
#bg{position:absolute;inset:-80px;background:radial-gradient(420px 420px at 80% 10%,var(--a),transparent 70%),radial-gradient(420px 420px at 10% 90%,var(--b),transparent 70%),#070a14}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
/* المشهد 1 */
#emoji{font-size:150px;line-height:1;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
#hook{font-size:48px;font-weight:900;line-height:1.35;margin-top:30px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#free{margin-top:22px;font-size:22px;font-weight:800;background:#fff;color:#111;border-radius:40px;padding:10px 26px}
/* المشهد 2 */
#name{position:absolute;top:56px;left:0;right:0;text-align:center}
#name b{display:inline-block;font-size:34px;font-weight:900;background:linear-gradient(135deg,var(--a),var(--b));padding:10px 30px;border-radius:24px;box-shadow:0 10px 40px -10px var(--a)}
#dev{position:absolute;left:50%;top:140px;transform:translateX(-50%);overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 6px #1d2233,0 0 0 8px rgba(255,255,255,.15)}
#dev.land{width:500px;height:260px;border-radius:22px;top:230px}
#dev.port{width:220px;height:460px;border-radius:32px}
#dev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
#feats{position:absolute;left:30px;right:30px;bottom:90px;display:flex;flex-direction:column;gap:14px}
#feats.land{bottom:150px}
.f{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:14px 18px;font-size:25px;font-weight:800;backdrop-filter:blur(10px)}
.f i{font-style:normal;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-size:24px;flex:0 0 44px}
/* المشهد 3 */
#cta1{font-size:54px;font-weight:900;line-height:1.3}
#cta2{margin-top:16px;font-size:26px;font-weight:700;opacity:.85}
#url{margin-top:34px;font-size:28px;font-weight:900;direction:ltr;background:#fff;color:#111;border-radius:22px;padding:18px 26px;box-shadow:0 20px 60px -10px var(--a)}
#bio{margin-top:18px;font-size:22px;font-weight:800;color:var(--a)}
#by{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:20px;font-weight:800;opacity:.75}
</style>
</head>
<body>
<div id="bg"></div>
<div class="sc" id="s1"><div id="emoji"></div><div id="hook"></div><div id="free">تطبيق مجاني 100%</div></div>
<div class="sc" id="s2" style="padding:0"><div id="name"><b></b></div><div id="dev"></div><div id="feats"></div></div>
<div class="sc" id="s3"><div id="cta1">حمّله مجانًا<br>الحين ⬇️</div><div id="cta2" class="c2"></div><div id="url">tatbeeqati-sa.pages.dev</div><div id="bio">الرابط في البايو 👆</div></div>
<div id="by">برمجة أبو نواف</div>
<script>
const C=window.CFG;
document.documentElement.style.setProperty('--a',C.a);document.documentElement.style.setProperty('--b',C.b);
$=id=>document.getElementById(id);
$('emoji').textContent=C.emoji;$('hook').innerHTML=C.hook;
$('name').querySelector('b').textContent=C.name;$('cta2').textContent=C.cta;
const dev=$('dev');dev.className=C.orient;
const imgs=C.imgs.map(src=>{const im=new Image();im.src=src;dev.appendChild(im);return im});
const fe=$('feats');fe.className=C.orient;
const fs=C.feats.map(([ic,t])=>{const d=document.createElement('div');d.className='f';d.innerHTML='<i>'+ic+'</i><span></span>';d.lastChild.textContent=t;fe.appendChild(d);return d});
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function vis(el,o,tx=0,ty=0,s=1){el.style.opacity=o;el.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}
window.render=function(t){
  // الخلفية تتحرك شوي
  $('bg').style.transform=`rotate(${t*4}deg) scale(1.1)`;
  // المشهد 1: 0 - 3
  const s1=$('s1');s1.style.opacity=t<2.6?1:1-ease((t-2.6)/0.4);s1.style.display=t<3?'flex':'none';
  vis($('emoji'),ease(t/0.4),0,0,back(t/0.6)*(1+0.04*Math.sin(t*6)));
  vis($('hook'),ease((t-0.4)/0.5),0,40*(1-ease((t-0.4)/0.5)));
  vis($('free'),ease((t-1.1)/0.4),0,0,back((t-1.1)/0.5));
  // المشهد 2: 3 - 11.4
  const s2=$('s2');const in2=ease((t-3)/0.4),out2=1-ease((t-11)/0.4);s2.style.opacity=Math.min(in2,out2);s2.style.display=(t>=2.9&&t<11.5)?'block':'none';
  vis($('name'),ease((t-3.1)/0.4),0,-30*(1-ease((t-3.1)/0.4)));
  dev.style.opacity=ease((t-3.2)/0.5);dev.style.transform=`translateX(-50%) scale(${0.85+0.15*back((t-3.2)/0.6)})`;
  const n=imgs.length,span=7.6/n;
  imgs.forEach((im,i)=>{const st=3.2+i*span,k=ease((t-st)/0.45);const show=t>=st;im.style.opacity=show?1:0;im.style.zIndex=i;im.style.transform=`translateX(${i===0?0:(1-k)*-100}%)`});
  fs.forEach((f,i)=>{const st=4.2+i*1.6;vis(f,ease((t-st)/0.4),60*(1-ease((t-st)/0.4)),0)});
  // المشهد 3: 11.3 - 15
  const s3=$('s3');s3.style.display=t>=11.2?'flex':'none';s3.style.opacity=ease((t-11.3)/0.4);
  vis($('cta1'),ease((t-11.3)/0.4),0,0,back((t-11.3)/0.5));
  vis($('cta2'),ease((t-11.8)/0.4));
  vis($('url'),ease((t-12.2)/0.4),0,0,back((t-12.2)/0.5)*(1+0.03*Math.sin((t-12)*5)));
  vis($('bio'),ease((t-12.8)/0.4),0,10*Math.sin(t*6));
};
render(0);
</script>
</body>
</html>
