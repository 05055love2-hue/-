<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>قصص برودكاست</title>
<style>
:root{--bg:#0f1a17;--card:#16241f;--card2:#1e302a;--line:rgba(255,255,255,.07);--text:#eef5f1;--soft:#9db3aa;--acc:#25d366;--acc2:#0e9f6e;--gold:#f5c76b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,'Segoe UI',Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:86px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.top{padding:22px 18px 8px;display:flex;align-items:flex-end;gap:10px}
.top small{color:var(--soft);font-size:14px}
.top h1{margin:2px 0 0;font-size:28px;font-weight:800}
.wrap{padding:6px 16px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-size:16px;padding:13px 0;outline:none}
.hero{background:linear-gradient(135deg,#0e9f6e,#1e6f5c);border-radius:22px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;cursor:pointer}
.hero::after{content:"✨";position:absolute;font-size:90px;opacity:.12;left:10px;top:-6px}
.hero small{font-size:13px;font-weight:700;opacity:.85}
.hero b{display:block;font-size:20px;margin:6px 0}
.hero p{margin:0;font-size:14.5px;line-height:1.8;opacity:.92;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:700}
.chips button.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:transform .12s}
.st:active{transform:scale(.98)}
.st .h{display:flex;align-items:center;gap:8px}
.st b{font-size:16.5px}
.st .cat{margin-inline-start:auto;font-size:12px;color:var(--soft);background:var(--card2);border-radius:10px;padding:2px 9px;flex:none}
.st p{margin:6px 0 0;color:var(--soft);font-size:14px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st .fav{color:var(--gold)}
.empty{text-align:center;color:var(--soft);padding:40px 10px;font-size:15px;line-height:1.9}
/* القراءة */
#reader{position:fixed;inset:0;background:var(--bg);z-index:8;display:none;flex-direction:column;animation:up .25s ease}
#reader.show{display:flex}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.rbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rbar button{background:var(--card);border:0;color:var(--text);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700}
.rbar .sp{flex:1}
.rbody{flex:1;overflow-y:auto;padding:22px 20px 30px}
.rbody .cat{display:inline-block;font-size:13px;color:var(--acc);font-weight:800;margin-bottom:6px}
.rbody h2{margin:0 0 16px;font-size:26px;line-height:1.4}
.rbody .txt{font-size:var(--fs,19px);line-height:2.1;white-space:pre-line}
.rbody .moral{margin-top:20px;background:rgba(245,199,107,.1);border-right:4px solid var(--gold);border-radius:12px;padding:12px 14px;color:var(--gold);font-weight:700;font-size:16px;line-height:1.8}
.racts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.racts button{border:0;border-radius:14px;padding:14px 8px;font-size:15.5px;font-weight:800;background:var(--card2);color:var(--text)}
.racts .wa{background:var(--acc);color:#062b16}
.nextprev{display:flex;gap:8px;margin-top:22px}
.nextprev button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--soft);border-radius:14px;padding:11px;font-size:14px;font-weight:700}
/* الشريط */
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(14,24,21,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:6}
nav button{background:none;border:0;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;padding:4px}
nav button i{font-style:normal;font-size:22px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--acc)}
nav button.on i{filter:none;opacity:1}
.credit{text-align:center;color:#5b6e66;font-size:12px;margin:22px 0 6px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#fff;color:#111;font-weight:700;border-radius:20px;padding:8px 18px;font-size:14px;display:none;z-index:9}
</style>
</head>
<body>

<div class="top"><div><small id="hello">حيّاك 👋</small><h1 id="ttl">قصص برودكاست</h1></div></div>
<div class="wrap">
  <div id="homeTop">
    <div class="search"><span>🔍</span><input id="q" placeholder="دوّر على قصة..."></div>
    <div class="hero" id="hero"><small>✨ قصة اليوم</small><b id="hT"></b><p id="hP"></p></div>
    <div class="chips" id="cats"></div>
  </div>
  <div id="list"></div>
  <div class="credit">برمجة أبو نواف</div>
</div>

<div id="reader">
  <div class="rbar"><button id="rBack">→ رجوع</button><span class="sp"></span><button id="fMinus">أ-</button><button id="fPlus">أ+</button><button id="rFav">☆</button></div>
  <div class="rbody" id="rBody"></div>
  <div class="racts"><button class="wa" id="rWa">إرسال واتساب</button><button id="rShare">مشاركة</button><button id="rCopy">نسخ</button></div>
</div>

<div class="toast" id="toast"></div>

<nav id="nav">
  <button data-p="home" class="on"><i>🏠</i>الرئيسية</button>
  <button data-p="rand"><i>🎲</i>قصة عشوائية</button>
  <button data-p="fav"><i>⭐</i>المفضلة</button>
</nav>

<script>
/* ===== القصص (كتابة أبو نواف) ===== */
const CATS={ebra:'💡 عبرة',funny:'😂 طرائف',deen:'🕌 إيمانية',fam:'❤️ أهل وبر',wisdom:'🦉 حكمة',life:'🌱 حياة'};
const S=[
['ebra','الفنجان المكسور','كان فيه شيبة عنده فنجان قديم مكسور طرفه، وكل يوم يشرب فيه قهوته.\nسأله ولده: يبه ليش ما تشتري فنجان جديد؟\nقال: هذا الفنجان شربت فيه مع أبوي الله يرحمه، ومع أمك، ومعك وأنت صغير. الكسر اللي فيه ما ينقص قيمته، يزيدها.','بعض الأشياء قيمتها في ذكرياتها، مو في شكلها.'],
['ebra','الحارس والمطر','حارس عمارة كان كل ليلة يشيل كراتين السكان من عند الباب قبل المطر.\nما أحد كان يدري، لين جا يوم غاب فيه، وتبللت أغراض الكل.\nفي اليوم الثاني لقى عند غرفته عشر علب حلا وورقة مكتوب فيها: «ما عرفنا قدرك إلا لما غبت».','لا تنتظر الغياب عشان تشكر اللي يتعب لك بصمت.'],
['ebra','المسمار','شاب عصبي، قال له أبوه: كل ما عصبت دق مسمار في الجدار.\nبعد شهر صار ما يدق ولا مسمار. قال أبوه: الحين كل يوم ما تعصب فيه، شيل مسمار.\nلما شالهم كلهم قال له: شوف الجدار، المسامير راحت بس الخروم باقية.','الكلمة الجارحة تنقال بثانية، وأثرها يبقى سنين.'],
['funny','أبو سعد والجي بي اس','أبو سعد ركّب جي بي اس جديد، وطول الطريق يقول له: «انعطف يمين».\nوأبو سعد يرد: «ما بغيت».\nبعد ساعة قال الجهاز: «جاري إعادة حساب المسار».\nقال أبو سعد: أخيراً واحد في هالبيت يعترف إنه غلطان 😂',''],
['funny','الحمية','واحد قال لزوجته: بديت الحمية اليوم.\nالساعة 10 الليل لقته في المطبخ ماسك صحن كبسة.\nقالت: وين الحمية؟\nقال: الحمية نامت، أنا اللي صاحي 😅',''],
['funny','المدرس والواجب','المدرس: وين واجبك يا فهد؟\nفهد: أكله الكلب يا أستاذ.\nالمدرس: بس أنت ما عندك كلب!\nفهد: إيه، عشان كذا كان جوعان 🐕',''],
['deen','الدعوة اللي ما ترد','رجّال كان كل يوم بعد الفجر يدعي لجاره المريض، وهو ما يعرفه زين.\nبعد شهور تشافى الجار، وجا يدق الباب ويقول: أمي تقول فيه أحد يدعي لي، أحس فيها.\nما قال له شي، بس ابتسم وقال: الحمد لله على سلامتك.','الدعاء بظهر الغيب له ملك يقول: ولك بمثل.'],
['deen','الريال اللي ما ضاع','طفل لقى ريال في المسجد، وراح يدوّر صاحبه صف صف.\nضحك عليه واحد وقال: ريال وش يسوي؟\nقال الطفل: أبوي يقول الأمانة ما لها حجم.\nسمعه الإمام، وصار يذكر القصة في كل خطبة عن الأمانة.','الأمانة تبان في الأشياء الصغيرة قبل الكبيرة.'],
['deen','الصدقة الخفية','امرأة كبيرة كانت كل خميس تحط كيس خبز عند باب بيت أرملة، وما تقول لأحد.\nلما توفت، انقطع الخبز. عرفت الأرملة مين كانت، وصارت تتصدق عنها كل خميس.\nوصارت الصدقة تمشي بعد صاحبتها.','الصدقة الخفية تطفي غضب الرب، وأجرها ما ينقطع.'],
['fam','دلة أمي','كنت أشوف أمي كل صباح تسوي القهوة وتنتظرنا نصحى.\nكبرنا وتزوجنا وتفرقنا، وبقت الدلة على النار كل صباح.\nسألتها: يمه لمين تسوين القهوة؟ قالت: يمكن واحد منكم يمر.\nمن يومها صرت أمرها كل صباح، ولو خمس دقايق.','زيارة قصيرة لأمك عندها تسوى الدنيا.'],
['fam','يد أبوي','وأنا صغير كنت أمسك يد أبوي عشان ما أطيح.\nاليوم أبوي كبر، ويمسك يدي عشان ما يطيح.\nفهمت إن الحياة دايرة، واللي تسويه لأبوك يرجع لك من عيالك.','برّك بوالديك دين، وعيالك بيردونه لك.'],
['fam','الأخ الكبير','أخوي الكبير كان يقول إنه ما يحب اللحم، ويعطيني نصيبه.\nكبرت واكتشفت إنه يحب اللحم أكثر مني، بس كنا فقارى وكان يبيني أشبع.\nاليوم كل ما أطبخ لحم أرسل له أول صحن.','بعض التضحيات ما تنفهم إلا بعد سنين.'],
['wisdom','الجمل والحبل','واحد ربط جمل كبير بحبل رقيق، وسأله ولده: ما يقدر يقطعه؟\nقال: يقدر، بس ربطته وهو صغير، وتعود إنه ما يقدر.\nفصار يصدّق إنه مربوط وهو أقوى من الحبل بمية مرة.','أغلب القيود اللي توقفك موجودة في راسك بس.'],
['wisdom','البئر والحمار','حمار طاح في بئر، وصاحبه قرر يدفنه، وصار يرمي عليه تراب.\nالحمار كل ما نزل عليه تراب ينفضه ويطلع فوقه.\nلين وصل فوق وطلع من البئر.','اللي يرمونه عليك ممكن تخليه درجة تطلع عليها.'],
['wisdom','الصياد والسمكة الكبيرة','صياد كل ما صاد سمكة كبيرة رجّعها للبحر، ويحتفظ بالصغيرة.\nسألوه: ليش؟ قال: مقلاتي صغيرة.\nضحكوا عليه، بس كثير منا يرد الفرص الكبيرة لأن أحلامه صغيرة.','كبّر مقلاتك قبل ما تشتكي من الصيد.'],
['life','الرسالة اللي ما انرسلت','كتب رسالة اعتذار لصديقه، وقال: بكرة أرسلها.\nصار بكرة أسبوع، والأسبوع سنة.\nوصله خبر إن صديقه توفى، والرسالة باقية في المسودة.','لا تأجل كلمة طيبة، يمكن ما يجي بكرة.'],
['life','القهوة والفناجين','دكتور جاب لطلابه دلة وفناجين أشكال: ذهب وزجاج وبلاستيك.\nكل واحد اختار الفنجان الأحلى.\nقال: الكل يبي القهوة، بس تضاربتوا على الفناجين.\nالحياة هي القهوة، والفلوس والمناصب فناجين بس.','استمتع بالقهوة، لا يشغلك الفنجان.'],
['life','الشجرة والفاس','حطاب يقطع شجرة طول اليوم وما خلص، وفاسه صار ثلم.\nقالوا له: سنّ الفاس. قال: ما عندي وقت، مشغول أقطع.\nوقعد يومين على شي ياخذ ساعة.','خذ وقت ترتاح وتجدد نفسك، الشغل بيمشي أسرع.'],
['ebra','الكرسي الفاضي','في كل عزيمة كانت جدتي تحط كرسي فاضي.\nسألناها، قالت: لأي ضيف يجي فجأة، ما يحس إنه زايد.\nمن يومها وأنا أحس إن البيت الكريم دايم فيه مكان لواحد زيادة.','الكرم مو بكثر الأكل، الكرم إن الضيف يحس إنه منتظر.'],
['funny','الواي فاي','جدّي سألني: وش يعني واي فاي؟\nقلت له: إنترنت بدون سلك.\nقال: يعني مثل الحريم يوصل الكلام بدون ما أحد يقوله؟ 😂',''],
['wisdom','الكيس والحجر','رجّال يمشي وكل ما زعل من أحد حط حجر في كيس على ظهره.\nبعد سنين صار يمشي محني، وما يقدر يكمل.\nقال له حكيم: فك الكيس، الحجارة مو على ظهورهم، على ظهرك أنت.','المسامحة راحة لك قبل ما تكون لغيرك.'],
['life','الجار الجديد','جانا جار جديد، وأول يوم طرق بابنا ومعه صحن حلا.\nأمي قالت: الصحن ما يرجع فاضي. ورجّعته بكبسة.\nوصار الصحن رايح جاي عشرين سنة، وصرنا أهل.','البداية الطيبة تفتح أبواب ما تسكر.']
];
/* ===== الحالة ===== */
const L={get(k,d){try{const v=localStorage.getItem('qs_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('qs_'+k,JSON.stringify(v))}catch(e){}}};
let favs=L.get('fav',[]),fs=L.get('fs',19),cat='all',page='home',cur=-1,order=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1600)}
const textOf=i=>{const s=S[i];return '📖 '+s[1]+'\n\n'+s[2]+(s[3]?'\n\n💡 '+s[3]:'')+'\n\n— من تطبيق «قصص برودكاست»'};

/* ===== قصة اليوم ===== */
const dayIdx=Math.floor(Date.now()/864e5)%S.length;
$('hT').textContent=S[dayIdx][1];$('hP').textContent=S[dayIdx][2];$('hero').onclick=()=>openStory(dayIdx,[dayIdx]);
const h=new Date().getHours();$('hello').textContent=h<12?'صباح الخير ☀️':'مساء الخير 🌙';

/* ===== التصنيفات والقائمة ===== */
function renderCats(){$('cats').innerHTML='<button data-c="all" class="'+(cat==='all'?'on':'')+'">📚 الكل</button>'+Object.entries(CATS).map(([k,n])=>'<button data-c="'+k+'" class="'+(cat===k?'on':'')+'">'+n+'</button>').join('');
 document.querySelectorAll('#cats button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderCats();renderList()})}
function renderList(){const q=$('q').value.trim();let idx=S.map((s,i)=>i);
 if(page==='fav')idx=favs.slice().reverse().filter(i=>S[i]);
 else{if(cat!=='all')idx=idx.filter(i=>S[i][0]===cat);if(q)idx=idx.filter(i=>(S[i][1]+S[i][2]).includes(q))}
 order=idx;
 $('list').innerHTML=idx.length?idx.map(i=>'<div class="st" data-i="'+i+'"><div class="h"><b>'+esc(S[i][1])+'</b>'+(favs.includes(i)?'<span class="fav">★</span>':'')+'<span class="cat">'+CATS[S[i][0]]+'</span></div><p>'+esc(S[i][2])+'</p></div>').join('')
  :'<div class="empty">'+(page==='fav'?'ما عندك قصص مفضلة للحين ⭐<br>افتح أي قصة واضغط النجمة':'ما لقيت قصة بهالكلمة 🔍')+'</div>';
 document.querySelectorAll('.st').forEach(e=>e.onclick=()=>openStory(+e.dataset.i,order))}
$('q').oninput=renderList;

/* ===== القراءة ===== */
function openStory(i,ord){cur=i;order=ord||order;const s=S[i],pos=order.indexOf(i);
 $('rBody').innerHTML='<span class="cat">'+CATS[s[0]]+'</span><h2>'+esc(s[1])+'</h2><div class="txt">'+esc(s[2])+'</div>'+(s[3]?'<div class="moral">💡 '+esc(s[3])+'</div>':'')+
  '<div class="nextprev">'+(pos>0?'<button id="pv">→ اللي قبلها</button>':'')+(pos>=0&&pos<order.length-1?'<button id="nx">اللي بعدها ←</button>':'')+'</div>';
 if($('pv'))$('pv').onclick=()=>openStory(order[pos-1]);if($('nx'))$('nx').onclick=()=>openStory(order[pos+1]);
 $('rFav').textContent=favs.includes(i)?'★':'☆';$('rBody').style.setProperty('--fs',fs+'px');$('rBody').scrollTop=0;$('reader').classList.add('show')}
function closeStory(){$('reader').classList.remove('show');renderList()}
$('rBack').onclick=closeStory;
window.goBack=()=>{if($('reader').classList.contains('show')){closeStory();return true}if(page!=='home'){go('home');return true}return false};
$('rFav').onclick=()=>{const k=favs.indexOf(cur);if(k>=0){favs.splice(k,1);toast('انشالت من المفضلة')}else{favs.push(cur);toast('انضافت للمفضلة ⭐')}L.set('fav',favs);$('rFav').textContent=favs.includes(cur)?'★':'☆'};
$('fPlus').onclick=()=>{fs=Math.min(28,fs+2);L.set('fs',fs);$('rBody').style.setProperty('--fs',fs+'px')};
$('fMinus').onclick=()=>{fs=Math.max(15,fs-2);L.set('fs',fs);$('rBody').style.setProperty('--fs',fs+'px')};
$('rWa').onclick=()=>{const t=textOf(cur);try{Native.whatsapp(t)}catch(e){location.href='https://wa.me/?text='+encodeURIComponent(t)}};
$('rShare').onclick=()=>{const t=textOf(cur);try{Native.share(t)}catch(e){if(navigator.share)navigator.share({text:t})}};
$('rCopy').onclick=()=>{const t=textOf(cur);try{Native.copy(t)}catch(e){navigator.clipboard&&navigator.clipboard.writeText(t);toast('تم النسخ ✓')}};

/* ===== التنقل ===== */
function go(p){if(p==='rand'){const r=Math.floor(Math.random()*S.length);openStory(r,[r]);return}
 page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
 $('homeTop').style.display=p==='home'?'':'none';$('ttl').textContent=p==='fav'?'المفضلة ⭐':'قصص برودكاست';renderList();scrollTo(0,0)}
