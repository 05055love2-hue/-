name: بناء التطبيق

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Earth images
        run: |
          T=https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets
          curl -fsSL -o app/src/main/assets/earth.jpg $T/earth_atmos_2048.jpg
          curl -fsSL -o app/src/main/assets/lights.png $T/earth_lights_2048.png
          ls -la app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk car-theme.apk
          cp tv/build/outputs/apk/debug/tv-debug.apk tv-launcher.apk
          cp router/build/outputs/apk/debug/router-debug.apk signal-app.apk
          cp seasons/build/outputs/apk/debug/seasons-debug.apk seasons.apk
          cp ytcar/build/outputs/apk/debug/ytcar-debug.apk mushaghli.apk
          cp rawatib/build/outputs/apk/debug/rawatib-debug.apk rawatib.apk
          cp obd/build/outputs/apk/debug/obd-debug.apk fahes.apk
          cp hammil/build/outputs/apk/debug/hammil-debug.apk hammil.apk
          python3 updates/make_versions.py

      - name: Hammil engine info
        continue-on-error: true
        run: |
          unzip -l hammil.apk | grep -iE "python|yt|dlp|ffmpeg" | head -40
          mkdir -p /tmp/h && cd /tmp/h && unzip -q -o $GITHUB_WORKSPACE/hammil.apk 'lib/arm64-v8a/*' 'assets/*' || true
          ls -la lib/arm64-v8a assets | head -40
          for f in lib/arm64-v8a/libpython*.so; do echo $f; unzip -l "$f" 2>/dev/null | grep -E "python3\.[0-9]+/os\.py|lib-dynload" | head -3; done
          for f in lib/arm64-v8a/*.so assets/*; do unzip -l "$f" 2>/dev/null | grep -iE "yt_dlp/version.py" && unzip -p "$f" '*yt_dlp/version.py' | head -5; done
          find . -name "yt-dlp*" -o -name "*youtube*" | head

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          # كل بناء ينشر نسخة جديدة برقمها، عشان عدد التحميلات ما يتصفّر
          tag_name: v${{ github.run_number }}
          name: نسخة ${{ github.run_number }}
          files: |
            car-theme.apk
            tv-launcher.apk
            signal-app.apk
            seasons.apk
            mushaghli.apk
            rawatib.apk
            fahes.apk
            hammil.apk
            versions.json
          make_latest: true

      - name: Screenshots
        run: |
          mkdir -p /tmp/shots
          A=$PWD/app/src/main/assets/index.html
          shot () { google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1280,600 \
            --virtual-time-budget=9000 --user-data-dir=/tmp/p-$1 --screenshot=/tmp/shots/$1.png "file://$A#$2"; }
          shot earth   "layout=classic&theme=night&bg=earth&wxMode=city"
          shot earthc  "layout=ring&theme=ocean&bg=earthc&wxMode=city"
          shot earthn  "layout=sport&theme=gold&bg=earthn&icons=glow&wxMode=city"
          shot dash    "layout=dash&theme=sea&bg=earth&wxMode=city"
          ls -la /tmp/shots

      - name: Save screenshots
        run: |
          git fetch origin previews || true
          git checkout -B previews
          git rm -rq --cached . >/dev/null
          rm -rf shots && mkdir shots && cp /tmp/shots/*.png shots/
          git add shots
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "screenshots" || true
          git push -f origin previews
