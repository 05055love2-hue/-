name: مقاطع الدعاية بالصوت

on:
  push:
    branches: [main]
    paths: ["promo/**", ".github/workflows/promo.yml"]
  workflow_dispatch:
    inputs:
      samples:
        description: "عينات الأصوات بدل المقاطع"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts numpy
      - name: Make voiced videos
        working-directory: promo
        run: |
          if [ "${{ inputs.samples }}" = "true" ]; then python voice.py samples; else python voice.py; fi
      - name: Publish videos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.samples && 'voice-samples' || 'promo' }}
          name: ${{ inputs.samples && 'عينات الأصوات' || 'مقاطع الدعاية' }}
          make_latest: false
          files: promo/out/*.mp4
