name: dltest
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          gh release download -R ${{ github.repository }} --pattern hammil.apk
          unzip -o -q hammil.apk res/raw/ytdlp
          echo "bundled:"; python res/raw/ytdlp --version
          U="https://www.tiktok.com/@scout2015/video/6718335390845095173"
          python res/raw/ytdlp -v --no-playlist -f "bv*[height<=720][ext=mp4][vcodec^=avc]+ba[ext=m4a]/b[height<=720][ext=mp4]/bv*[height<=720]+ba/b[height<=720]/bv*+ba/b" -o "a/%(title).80B.%(ext)s" "$U" 2>&1 | tail -25 || true
          curl -sL -o latest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          echo "latest:"; python latest --version
          python latest --no-playlist -f "bv*[height<=720][ext=mp4][vcodec^=avc]+ba[ext=m4a]/b[height<=720][ext=mp4]/bv*[height<=720]+ba/b[height<=720]/bv*+ba/b" -o "b/%(title).80B.%(ext)s" "$U" 2>&1 | tail -15 || true
          ls -la a b || true
        env: { GH_TOKEN: "${{ github.token }}" }
