plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cartheme.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.cartheme.app"
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName "1.8"
    }

    signingConfigs {
        debug {
            storeFile file('car.keystore')
            storePassword 'car12345'
            keyAlias 'car'
            keyPassword 'car12345'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
